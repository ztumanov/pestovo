<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <title>ФГКУ «Санаторий «Ясная Поляна» ФТС России»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet" />
    <script>
      // Instantly start parallel non-blocking fetch for site-data.json before scripts parse
      (function() {
        try {
          var cacheBuster = Date.now();
          window.__SITE_DATA_EARLY_PROMISE__ = fetch('/site-data.json?t=' + cacheBuster, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          }).then(function(res) {
            if (!res.ok) return null;
            var etag = res.headers.get('ETag') || res.headers.get('Last-Modified') || ('sz_' + res.headers.get('Content-Length')) || '';
            return res.json().then(function(data) {
              window.__EARLY_SITE_DATA__ = data;
              // Immediate background warm-up of hero slide photo and room photos to eliminate image decode delay
              if (data && data.hero && Array.isArray(data.hero.slides)) {
                for (var i = 0; i < data.hero.slides.length; i++) {
                  var s = data.hero.slides[i];
                  if (s && s.type === 'photo' && s.url) {
                    var img = new Image();
                    img.src = s.url;
                    break;
                  }
                }
              }
              if (data && data.rooms && Array.isArray(data.rooms)) {
                for (var r = 0; r < Math.min(data.rooms.length, 2); r++) {
                  if (data.rooms[r] && data.rooms[r].image) {
                    var rImg = new Image();
                    rImg.src = data.rooms[r].image;
                  }
                }
              }
              return { data: data, etag: etag, timestamp: cacheBuster };
            });
          }).catch(function() { return null; });
        } catch (e) {
          window.__SITE_DATA_EARLY_PROMISE__ = null;
        }
      })();
    </script>
  </head>
  <body class="bg-[#022C22]">
    <div id="root">
      <div style="min-height:100vh;background-color:#022C22;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FAF9F6;font-family:ui-serif, Georgia, Cambria, serif;user-select:none;">
        <div style="width:40px;height:40px;border:3px solid rgba(197,168,128,0.25);border-top-color:#c5a880;border-radius:50%;animation:yasnayaSpin 0.75s linear infinite;margin-bottom:18px;"></div>
        <div style="font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#c5a880;font-weight:600;opacity:0.95;">Санаторий «Ясная Поляна»</div>
        <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#a8a29e;margin-top:6px;opacity:0.75;">ФТС России • Гаспра</div>
      </div>
      <style>
        @keyframes yasnayaSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
